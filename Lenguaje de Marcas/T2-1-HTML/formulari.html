<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="POST">
        <fieldset>
            <legend>Datos Personales</legend>
            <label for="name">Nombre y Apellidos:</label>
            <input type="text" id="name" name="name" placeholder="Escribe tu nombre" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Escribe tu email" required><br><br>

            <label for="contra">Contraseña:</label>
            <input type="password" min="8" id="contra" name="contra" placeholder="Escribe tu contraseña" required><br><br>

            <label for="cumple">Fecha de Nacimiento:</label>
            <input type="date" id="cumple" name="cumple" required><br><br>

            <label for="edad">Edad:</label>
            <input type="number" min="16" max="99" required id="edad" name="edad"><br><br>
        </fieldset>
        <fieldset>
            <legend>Datos Academicos</legend>

            <label for="turno">Turno?</label>
                <br>
            <input type="radio" id="M" name="turno">Mañana
                <br>
            <input type="radio" id="T" name="turno"> Tarde
                <br><br>

            <p>Modulos Matriculados</p>
                <br>

                <input type="checkbox" id="LDM" name="LDM" value="Lenguaje de Marcas">
                <label for="LDM">Lenguaje de Marcas</label>
                <br>
                
                <input type="checkbox" id="P" name="P" value="Programacion">
                <label for="P">Lenguaje de Marcas</label>
                <br>

                <input type="checkbox" id="BD" name="BD" value="Bases de Datos">
                <label for="BD">Bases de Datos</label>
                <br><br> 
            <label for="experiencia">Experiencia:</label>
                <br>
                <select name="experiencia" id="experiencia">
                    <option value="sin">Sin Experiencia</option>
                    <option value="basico">Basico</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>
        </fieldset>
        <fieldset>
            <legend>Observaciones y Botones</legend>
            <label for="comentarios">Comentarios</label><br>
            <textarea rows="4" cols="40" id="comentarios" placeholder="Escirbe sobre ti"></textarea>

            <br>

            <label for="politica">Aceptas la olitica de Privacidad?</label><br>
            <input type="checkbox" id="si" name="si" value="si">
            <label for="si">Si</label>

            <br>

            <input type="checkbox" id="no" name="no" value="no">
            <label for="no">No</label>

            <br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Reiniciar Datos">
        </fieldset>
    </form>
</body>
</html>
